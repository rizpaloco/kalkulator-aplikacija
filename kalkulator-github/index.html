<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#007aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalkulator">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
  :root {
    color-scheme: light;
    --bg: #f2f2f7; --card: #ffffff; --text: #111111; --muted: #8e8e93;
    --btn: #e5e5ea; --btnt: #111111; --fn: #d4d4d8; --fnt: #111111;
    --op: #ff9500; --accent: #007aff; --line: #d1d1d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #000000; --card: #1c1c1e; --text: #ffffff; --muted: #8e8e93;
      --btn: #333333; --btnt: #ffffff; --fn: #a5a5a5; --fnt: #000000;
      --op: #ff9500; --accent: #0a84ff; --line: #3a3a3c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000; --card: #1c1c1e; --text: #ffffff; --muted: #8e8e93;
    --btn: #333333; --btnt: #ffffff; --fn: #a5a5a5; --fnt: #000000;
    --op: #ff9500; --accent: #0a84ff; --line: #3a3a3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  nav { display: flex; gap: 6px; overflow-x: auto; padding: 10px; background: var(--card); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: 0 0 auto; border: none; border-radius: 999px; padding: 8px 14px; background: var(--btn); color: var(--btnt); font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
  nav button.on { background: var(--accent); color: #fff; }
  main { flex: 1; overflow-y: auto; }
  .panel { display: none; padding: 16px; max-width: 560px; margin: 0 auto; flex-direction: column; gap: 12px; min-height: 100%; }
  .panel.on { display: flex; }
  h2 { font-size: 20px; font-weight: 600; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; }
  .fields { display: flex; flex-direction: column; gap: 10px; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .out { white-space: pre-line; font-size: 16px; line-height: 1.6; word-break: break-word; min-height: 24px; }
  .primary { border: none; border-radius: 12px; padding: 13px; width: 100%; background: var(--accent); color: #fff; font: inherit; font-size: 17px; cursor: pointer; }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.4; }
  .graph { background: var(--card); border-radius: 14px; padding: 8px; }
  .graph:empty { display: none; }
  .plot { width: 100%; height: auto; display: block; }
  .plot .grid { stroke: var(--line); stroke-width: .5; }
  .plot .axis { stroke: var(--text); stroke-width: 1; }
  .plot .curve { fill: none; stroke-width: 2; }
  .plot .tick { font-size: 9px; fill: var(--muted); }
  .plot .lbl { font-size: 10px; fill: var(--text); }
  .disp { background: var(--card); border-radius: 14px; padding: 14px; text-align: right; min-height: 110px; display: flex; flex-direction: column; justify-content: flex-end; }
  #bExp, #sExp { color: var(--muted); font-size: 16px; min-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bRes, #sRes { font-size: clamp(36px, 12vw, 56px); font-weight: 300; word-break: break-all; line-height: 1.1; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: auto; }
  .k { border: none; border-radius: 50%; aspect-ratio: 1 / 1; width: 100%; font: inherit; font-size: 26px; background: var(--btn); color: var(--btnt); cursor: pointer; }
  .k:active { filter: brightness(1.4); }
  .k.f { background: var(--fn); color: var(--fnt); }
  .k.o { background: var(--op); color: #fff; }
  .k.z { grid-column: span 2; aspect-ratio: 2 / 1; border-radius: 999px; }
  .sk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sk .k { aspect-ratio: auto; height: 52px; border-radius: 12px; font-size: 16px; }
</style>
</head>
<body>
<nav>
  <button class="on" data-tab="basic" data-i18n="tab_basic">Osnovni</button>
  <button data-tab="sci" data-i18n="tab_sci">Naučni</button>
  <button data-tab="phys" data-i18n="tab_phys">Fizika</button>
  <button data-tab="math" data-i18n="tab_math">Matematika</button>
  <button data-tab="stat" data-i18n="tab_stat">Statistika</button>
  <button data-tab="geo" data-i18n="tab_geo">Geometrija</button>
  <button data-tab="co" data-i18n="tab_co">Koordinate</button>
  <button data-tab="cam" data-i18n="tab_cam">Kamera</button>
  <button data-tab="settings" data-i18n="tab_settings">Postavke</button>
</nav>

<main>

  <section class="panel on" id="basic">
    <div class="disp"><div id="bExp"></div><div id="bRes">0</div></div>
    <div class="keys" id="keys">
      <button class="k f" data-a="ac">AC</button>
      <button class="k f" data-a="sign">+/−</button>
      <button class="k f" data-a="pct">%</button>
      <button class="k o" data-a="op" data-v="/">÷</button>
      <button class="k" data-d="7">7</button>
      <button class="k" data-d="8">8</button>
      <button class="k" data-d="9">9</button>
      <button class="k o" data-a="op" data-v="*">×</button>
      <button class="k" data-d="4">4</button>
      <button class="k" data-d="5">5</button>
      <button class="k" data-d="6">6</button>
      <button class="k o" data-a="op" data-v="-">−</button>
      <button class="k" data-d="1">1</button>
      <button class="k" data-d="2">2</button>
      <button class="k" data-d="3">3</button>
      <button class="k o" data-a="op" data-v="+">+</button>
      <button class="k z" data-d="0">0</button>
      <button class="k" id="decBtn" data-a="dec">,</button>
      <button class="k o" data-a="eq">=</button>
    </div>
    <p class="hint" data-i18n="hint_basic"></p>
  </section>

  <section class="panel" id="sci">
    <h2 data-i18n="h_sci"></h2>
    <div class="disp"><div id="sExp"></div><div id="sRes">0</div></div>
    <input id="sIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-ph="ph_sci">
    <div class="sk" id="sciKeys">
      <button class="k f" data-f="sin">sin</button>
      <button class="k f" data-f="cos">cos</button>
      <button class="k f" data-f="tan">tan</button>
      <button class="k f" data-f="pi">π</button>
      <button class="k f" data-f="asin">asin</button>
      <button class="k f" data-f="acos">acos</button>
      <button class="k f" data-f="atan">atan</button>
      <button class="k f" data-f="e">e</button>
      <button class="k f" data-f="ln">ln</button>
      <button class="k f" data-f="log">log</button>
      <button class="k f" data-f="exp">eˣ</button>
      <button class="k f" data-f="sqrt">√</button>
      <button class="k f" data-f="sq">x²</button>
      <button class="k f" data-f="inv">1/x</button>
      <button class="k f" data-f="fact">n!</button>
      <button class="k f" data-f="c">C</button>
    </div>
    <p class="hint" data-i18n="hint_sci"></p>
  </section>

  <section class="panel" id="phys">
    <h2 data-i18n="tab_phys"></h2>
    <div class="card"><label data-i18n="lbl_formula"></label><select id="phSel"></select></div>
    <div class="card fields" id="phFields"></div>
    <button class="primary" id="phBtn" data-i18n="btn_compute"></button>
    <div class="card out" id="phOut"></div>
    <p class="hint" data-i18n="hint_phys"></p>
  </section>

  <section class="panel" id="math">
    <h2 data-i18n="tab_math"></h2>
    <div class="card"><label data-i18n="lbl_level"></label>
      <select id="mathLvl">
        <option value="o" data-i18n="lvl_o"></option>
        <option value="s" data-i18n="lvl_s"></option>
        <option value="f" data-i18n="lvl_f"></option>
      </select>
    </div>
    <div class="card"><label data-i18n="lbl_task"></label><select id="mathSel"></select></div>
    <div class="card fields" id="mathFields"></div>
    <button class="primary" id="mathBtn" data-i18n="btn_solve"></button>
    <div class="card out" id="mathOut"></div>
    <p class="hint" data-i18n="hint_math"></p>
  </section>

  <section class="panel" id="stat">
    <h2 data-i18n="tab_stat"></h2>
    <div class="card"><label data-i18n="lbl_stat_in"></label><textarea id="stIn" rows="4" autocomplete="off" autocapitalize="off" spellcheck="false" data-ph="ph_stat"></textarea></div>
    <button class="primary" id="stBtn" data-i18n="btn_compute"></button>
    <div class="card out" id="stOut"></div>
  </section>

  <section class="panel" id="geo">
    <h2 data-i18n="tab_geo"></h2>
    <div class="card"><label data-i18n="lbl_shape"></label><select id="geoSel"></select></div>
    <div class="card fields" id="geoFields"></div>
    <button class="primary" id="geoBtn" data-i18n="btn_compute"></button>
    <div class="card out" id="geoOut"></div>
    <div class="graph" id="geoGraph"></div>
  </section>

  <section class="panel" id="co">
    <h2 data-i18n="tab_co"></h2>
    <div class="card"><label data-i18n="lbl_co_mode"></label><select id="coSel"></select></div>
    <div class="card fields" id="coFields"></div>
    <button class="primary" id="coBtn" data-i18n="btn_compute"></button>
    <div class="card out" id="coOut"></div>
    <div class="graph" id="coGraph"></div>
    <p class="hint" data-i18n="hint_co"></p>
  </section>

<section class="panel" id="cam">
    <h2 data-i18n="tab_cam"></h2>
    <div class="card fields">
      <input id="camFile" type="file" accept="image/*" capture="environment">
      <img id="camImg" alt="" style="display:none;width:100%;border-radius:12px">
    </div>
    <button class="primary" id="camRead" data-i18n="cam_read"></button>
    <div class="card"><label data-i18n="cam_text_lbl"></label><textarea id="camText" rows="5" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></div>
    <button class="primary" id="camSolve" data-i18n="cam_solve"></button>
    <div class="card out" id="camOut"></div>
    <p class="hint" id="camStatus" data-i18n="cam_hint"></p>
  </section>

  <section class="panel" id="settings">
    <h2 data-i18n="tab_settings"></h2>
    <div class="card fields">
      <div><label data-i18n="lbl_lang"></label>
        <select id="setLang">
          <option value="sr">Srpski</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="hr">Hrvatski</option>
          <option value="pt">Português</option>
        </select>
      </div>
      <div><label data-i18n="lbl_theme"></label>
        <select id="setTheme">
          <option value="auto" data-i18n="th_auto"></option>
          <option value="light" data-i18n="th_light"></option>
          <option value="dark" data-i18n="th_dark"></option>
        </select>
      </div>
      <div><label data-i18n="lbl_prec"></label>
        <select id="setPrec">
          <option value="4">4</option><option value="6">6</option><option value="8">8</option>
          <option value="10" selected>10</option><option value="12">12</option>
        </select>
      </div>
      <div><label data-i18n="lbl_sep"></label>
        <select id="setSep">
          <option value="," data-i18n="sep_comma"></option>
          <option value="." data-i18n="sep_dot"></option>
        </select>
      </div>
      <div><label data-i18n="lbl_ang"></label>
        <select id="setAng">
          <option value="deg" data-i18n="ang_deg"></option>
          <option value="rad" data-i18n="ang_rad"></option>
        </select>
      </div>
    </div>
  </section>

</main>

<script src="math.js"></script>

function fmt(n) {
  if (typeof n !== 'number' || !isFinite(n)) return 'Greška';
  if (n === 0) return '0';
  const s = (Math.abs(n) >= 1e12 || Math.abs(n) < 1e-6)

}

function num(s) { const t = String(s).trim().replace(',', '.'); return t === '' ? NaN : Number(t); }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
function fracStr(p, q) {
  if (q === 0) return 'nedefinisano';
  if (q < 0) { p = -p; q = -q; }
  const g = gcd(p, q) || 1; p /= g; q /= g;
  return q === 1 ? String(p) : `${p}/${q}`;
}

function nCk(n, k) { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }

  return s * y;
}
function Phi(z) { return 0.5 * (1 + erf(z / Math.SQRT2)); }

  if (!xs.length) { xs = [-1, 1]; ys = [-1, 1]; }
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (x0 === x1) { x0 -= 1; x1 += 1; }
  if (y0 === y1) { y0 -= 1; y1 += 1; }

    const span = Math.max(x1 - x0, y1 - y0), cxm = (x0 + x1) / 2, cym = (y0 + y1) / 2;
    x0 = cxm - span / 2; x1 = cxm + span / 2; y0 = cym - span / 2; y1 = cym + span / 2;

  }
  if (y0 <= 0 && y1 >= 0) g += `<line x1="${P}" y1="${Y(0)}" x2="${W - P}" y2="${Y(0)}" class="axis"/>`;
  if (x0 <= 0 && x1 >= 0) g += `<line x1="${X(0)}" y1="${P}" x2="${X(0)}" y2="${H - P}" class="axis"/>`;

    if (m.l) g += `<text x="${X(m.x) + 5}" y="${Y(m.y) - 5}" class="lbl">${m.l}</text>`;

}

let cur = '0', prev = null, op = null, reset = false;
const SYM = { '/': '÷', '*': '×', '-': '−', '+': '+' };
function clearIfError() { if (cur === 'Greška') { cur = '0'; prev = null; op = null; reset = false; } }
function upd() { $('bRes').textContent = cur; $('bExp').textContent = (prev !== null && op) ? prev + ' ' + SYM[op] : ''; }
function digit(d) { clearIfError(); if (reset) { cur = d; reset = false; } else cur = cur === '0' ? d : cur + d; upd(); }
function dec() { clearIfError(); if (reset) { cur = '0' + S.sep; reset = false; } else if (!cur.includes(',') && !cur.includes('.')) cur += S.sep; upd(); }
function calc(a, b, o) { switch (o) { case '+': return a + b; case '-': return a - b; case '*': return a * b; case '/': return b === 0 ? NaN : a / b; } return b; }
function setOp(o) { clearIfError(); if (op && !reset) cur = fmt(calc(num(prev), num(cur), op)); prev = cur; op = o; reset = true; upd(); }
function eq() { if (!op) return; const r = fmt(calc(num(prev), num(cur), op)); $('bExp').textContent = prev + ' ' + SYM[op] + ' ' + cur + ' ='; cur = r; prev = null; op = null; reset = true; $('bRes').textContent = cur; }
function ac() { cur = '0'; prev = null; op = null; reset = false; upd(); }
function sign() { clearIfError(); if (cur !== '0') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; upd(); }
function pct() { clearIfError(); cur = fmt(num(cur) / 100); upd(); }
$('keys').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d !== undefined) return digit(b.dataset.d);
  switch (b.dataset.a) { case 'op': setOp(b.dataset.v); break; case 'eq': eq(); break; case 'ac': ac(); break; case 'sign': sign(); break; case 'pct': pct(); break; case 'dec': dec(); break; }

const ang = x => S.deg ? x * Math.PI / 180 : x;
const unang = y => S.deg ? y * 180 / Math.PI : y;
const FN = {
  sin: x => Math.sin(ang(x)), cos: x => Math.cos(ang(x)), tan: x => Math.tan(ang(x)),
  asin: x => unang(Math.asin(x)), acos: x => unang(Math.acos(x)), atan: x => unang(Math.atan(x)),
  ln: x => Math.log(x), log: x => Math.log10(x), exp: x => Math.exp(x), sqrt: x => Math.sqrt(x),

   ===================================================================== */
const REFRESH = [];

function setupTool(p, tools, lvlSel) {
  const sel = $(p + 'Sel'), box = $(p + 'Fields'), out = $(p + 'Out'), gr = $(p + 'Graph');
  let list = tools;

  const draw = keepVals => {
    const t = list[+sel.value]; if (!t) return;
    const old = {};
    if (keepVals) box.querySelectorAll('input').forEach(i => old[i.id] = i.value);
    box.innerHTML = t.f.map(([k, l]) =>
      `<div><label>${tr(l)}</label><input id="${p}_${k}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`
    ).join('');
    if (keepVals) box.querySelectorAll('input').forEach(i => { if (old[i.id] !== undefined) i.value = old[i.id]; });
    out.textContent = ''; if (gr) gr.innerHTML = '';
  };

  const fill = keepIdx => {
    const cur0 = sel.value;
    list = lvlSel ? tools.filter(t => t.lvl.includes($(lvlSel).value)) : tools;
    sel.innerHTML = '';
    list.forEach((t, i) => sel.add(new Option(tr(t.n), i)));
    if (keepIdx && +cur0 < list.length) sel.value = cur0;
    draw(!!keepIdx);
  };

  sel.onchange = () => draw(false);
  if (lvlSel) $(lvlSel).onchange = () => fill(false);
  REFRESH.push(() => fill(true));

  $(p + 'Btn').onclick = () => {
    const t = list[+sel.value]; if (!t) return;
    const v = {}; let bad = false;
    t.f.forEach(([k, l, typ]) => {
      const raw = $(p + '_' + k).value;
      if (typ === 't') { v[k] = raw.trim(); if (!v[k]) bad = true; }
      else if (typ === 'o') { v[k] = raw.trim(); }
      else { const x = num(raw); v[k] = x; if (!isFinite(x)) bad = true; }
    });
    if (bad) { out.textContent = T('msg_fill'); if (gr) gr.innerHTML = ''; return; }
    try {
      const r = t.run(v);
      if (typeof r === 'string') { out.textContent = r; if (gr) gr.innerHTML = ''; }
      else { out.textContent = r.text || ''; if (gr) gr.innerHTML = r.svg || ''; }
    } catch (e) { out.textContent = T('msg_err') + ': ' + e.message; if (gr) gr.innerHTML = ''; }
  };
  fill(false);
}

function physDraw(keepVals) {
  const p = PHYS[+$('phSel').value];
  const old = {};
  if (keepVals) $('phFields').querySelectorAll('input').forEach(i => old[i.id] = i.value);
  $('phFields').innerHTML = Object.entries(p.v).map(([k, [l, u]]) =>
    `<div><label>${tr(l)} (${k}) [${u}]</label><input id="ph_${k}" type="text" autocomplete="off" spellcheck="false" placeholder="${T('ph_empty')}"></div>`
  ).join('');
  if (keepVals) $('phFields').querySelectorAll('input').forEach(i => { if (old[i.id] !== undefined) i.value = old[i.id]; });
  $('phOut').textContent = '';
}
function physCalc() {
  const p = PHYS[+$('phSel').value];
  const vals = {}, miss = [];
  for (const k of Object.keys(p.v)) {
    const raw = $('ph_' + k).value.trim();
    if (raw === '') miss.push(k); else vals[k] = num(raw);
  }
  if (miss.length !== 1) { $('phOut').textContent = T('msg_one_empty'); return; }
  const t = miss[0], ex1 = p.e[t];
  if (!ex1) { $('phOut').textContent = T('msg_no_formula'); return; }
  if (Object.values(vals).some(x => !isFinite(x))) { $('phOut').textContent = T('msg_fill'); return; }
  const names = Object.keys(vals);
  let r;
  try { r = new Function(...names, 'return (' + ex1 + ');')(...names.map(n => vals[n])); } catch (err) { r = NaN; }
  if (isFinite(r)) { $('ph_' + t).value = fmt(r); $('phOut').textContent = `${tr(p.n)}: ${t} = ${fmt(r)} ${p.v[t][1]}`; }
  else $('phOut').textContent = T('msg_bad_result');
}
function physFill(keepIdx) {
  const cur0 = $('phSel').value;
  $('phSel').innerHTML = '';
  PHYS.forEach((p, i) => $('phSel').add(new Option(tr(p.n) + ':  ' + p.f, i)));
  if (keepIdx) $('phSel').value = cur0;
  physDraw(!!keepIdx);
}
$('phSel').onchange = () => physDraw(false);
$('phBtn').onclick = physCalc;

      const G = [(A_[0] + B_[0] + C_[0]) / 3, (A_[1] + B_[1] + C_[1]) / 3];

      const sides2 = kind[1] ** 2 + kind[2] ** 2 - kind[0] ** 2;
      const type = Math.abs(sides2) < 1e-9 ? 'pravougli' : sides2 > 0 ? 'oštrougli' : 'tupougli';
      const text = L(
        kv('perim', a + b + c), kv('area', P) + ' (Heron)',
        `α = ${fmt(alpha)}°, β = ${fmt(beta)}°, γ = ${fmt(gamma)}°`,

        `Upisani krug r = ${fmt(r_)}`,
        `Težište T = (${fmt(G[0])}; ${fmt(G[1])})`,
        `Visine: h_a = ${fmt(2 * P / a)}, h_b = ${fmt(2 * P / b)}, h_c = ${fmt(2 * P / c)}`,

      );
      const circle = circPts(U[0], U[1], R_, 150);
      return { text, svg: svgPlot([{ pts: [A_, B_, C_, A_], fill: '#007aff', closed: true }, { pts: circle, c: '#34c759', dash: true }],
        [{ x: U[0], y: U[1], l: 'O', c: '#34c759' }, { x: G[0], y: G[1], l: 'T', c: '#ff2d55' }, { x: A_[0], y: A_[1], l: 'A' }, { x: B_[0], y: B_[1], l: 'B' }, { x: C_[0], y: C_[1], l: 'C' }], { equal: true }) };
    } },
  { lvl: 'all', n: { sr: 'Opšti poligon iz tačaka', en: 'Polygon from points', es: 'Polígono por puntos', hr: 'Poligon iz točaka', pt: 'Polígono a partir de pontos' }, f: [['pts', { sr: 'Tačke (x y; x y; …), npr. 0 0; 4 0; 4 3; 0 3', en: 'Points (x y; x y; …), e.g. 0 0; 4 0; 4 3; 0 3', es: 'Puntos (x y; x y; …), p. ej. 0 0; 4 0; 4 3; 0 3', hr: 'Točke (x y; x y; …), npr. 0 0; 4 0; 4 3; 0 3', pt: 'Pontos (x y; x y; …), ex. 0 0; 4 0; 4 3; 0 3' }, 't']],
    run: v => {

    run: v => ({ text: L(kv('vol', 4 / 3 * Math.PI * v.r ** 3), kv('surf', 4 * Math.PI * v.r * v.r)),

    run: v => ({ text: L(kv('vol', Math.PI * v.r * v.r * v.h), kv('surf', 2 * Math.PI * v.r * (v.r + v.h))),
      svg: svgPlot([{ pts: circ3(v.r, 0), c: '#007aff' }, { pts: circ3(v.r, v.h), c: '#007aff' },
        { pts: [P3(v.r, 0, 0), P3(v.r, 0, v.h)], c: '#007aff' }, { pts: [P3(-v.r, 0, 0), P3(-v.r, 0, v.h)], c: '#007aff' }], [], { equal: true }) }) },
  { lvl: 'all', n: { sr: 'Kupa', en: 'Cone', es: 'Cono', hr: 'Stožac', pt: 'Cone' }, f: [['r', { sr: 'Poluprečnik r', en: 'Radius r', es: 'Radio r', hr: 'Polumjer r', pt: 'Raio r' }], ['h', { sr: 'Visina h', en: 'Height h', es: 'Altura h', hr: 'Visina h', pt: 'Altura h' }]],
    run: v => { const l = Math.hypot(v.r, v.h); return { text: L(kv('vol', Math.PI * v.r * v.r * v.h / 3), kv('surf', Math.PI * v.r * (v.r + l)), `Izvodnica l = ${fmt(l)}`),
      svg: svgPlot([{ pts: circ3(v.r, 0) }, { pts: [P3(v.r, 0, 0), P3(0, 0, v.h), P3(-v.r, 0, 0)] }, { pts: [P3(0, 0, v.h), P3(0, 0, 0)], dash: true }], [], { equal: true }) }; } },
  { lvl: 'all', n: { sr: 'Piramida sa kvadratnom osnovom', en: 'Square-based pyramid', es: 'Pirámide de base cuadrada', hr: 'Piramida s kvadratnom osnovicom', pt: 'Pirâmide de base quadrada' }, f: [['a', { sr: 'Stranica osnove a', en: 'Base side a', es: 'Lado de la base a', hr: 'Stranica osnovice a', pt: 'Lado da base a' }], ['h', { sr: 'Visina h', en: 'Height h', es: 'Altura h', hr: 'Visina h', pt: 'Altura h' }]],
    run: v => {
      const m = Math.sqrt(v.h * v.h + v.a * v.a / 4);
      const apex = P3(v.a / 2, v.a / 2, v.h);
      const base = [P3(0, 0, 0), P3(v.a, 0, 0), P3(v.a, v.a, 0), P3(0, v.a, 0), P3(0, 0, 0)];
      return { text: L(kv('vol', v.a * v.a * v.h / 3), kv('surf', v.a * v.a + 2 * v.a * m), `Apotema strane = ${fmt(m)}`),
        svg: svgPlot([{ pts: base, c: '#007aff' }, { pts: [base[0], apex, base[1]] }, { pts: [base[1], apex, base[2]] }, { pts: [base[0], apex] }, { pts: [base[3], apex], dash: true }, { pts: [base[2], apex], dash: true }], [], { equal: true }) };
    } }
];

function box3(a, b, c) {
  const F = [[0, 0, 0], [a, 0, 0], [a, b, 0], [0, b, 0], [0, 0, 0]].map(p => P3(...p));
  const B = [[0, 0, c], [a, 0, c], [a, b, c], [0, b, c], [0, 0, c]].map(p => P3(...p));
  const E = [[[0, 0, 0], [0, 0, c]], [[a, 0, 0], [a, 0, c]], [[a, b, 0], [a, b, c]], [[0, b, 0], [0, b, c]]].map(([p, q]) => ({ pts: [P3(...p), P3(...q)] }));
  return svgPlot([{ pts: F, c: '#007aff' }, { pts: B, c: '#007aff' }, ...E], [], { equal: true });
}

setupTool('geo', GEO);

/* =====================================================================
   KOORDINATNI SISTEM: grafici, analiza funkcija, prave, konike
   ===================================================================== */
function fnAnalysis(v) {
  needMath();
  const e1 = ex(v.f), a = v.a, b = v.b;
  if (!(b > a)) return 'xmin mora biti manji od xmax.';
  const F = x => { try { const y = math.evaluate(e1, { x }); return typeof y === 'number' ? y : NaN; } catch (_) { return NaN; } };
  const N = 1200, h = (b - a) / N;
  const xs = [], ys = [];
  for (let i = 0; i <= N; i++) { const x = a + i * h; xs.push(x); ys.push(F(x)); }
  const D = x => { const k = 1e-6 * (1 + Math.abs(x)); return (F(x + k) - F(x - k)) / (2 * k); };
  const S2 = x => { const k = 1e-3 * (1 + Math.abs(x)); return (F(x + k) - 2 * F(x) + F(x - k)) / (k * k); };
  const bis = (g, lo, hi) => {
    let fl = g(lo);
    for (let i = 0; i < 70; i++) { const m = (lo + hi) / 2, fm = g(m); if (Math.sign(fm) === Math.sign(fl)) { lo = m; fl = fm; } else hi = m; }
    return (lo + hi) / 2;
  };
  const zeros = [], ext = [], infl = [], disc = [];
  for (let i = 0; i < N; i++) {
    const x0 = xs[i], x1 = xs[i + 1], y0 = ys[i], y1 = ys[i + 1];
    if (!isFinite(y0) || !isFinite(y1)) { disc.push(x0); continue; }
    if (Math.abs(y1 - y0) > 1e4 && Math.sign(y0) !== Math.sign(y1)) { disc.push((x0 + x1) / 2); continue; }
    if (y0 === 0) zeros.push(x0);
    else if (Math.sign(y0) !== Math.sign(y1) && y1 !== 0) zeros.push(bis(F, x0, x1));
  }
  const dv = xs.map(x => D(x)), sv = xs.map(x => S2(x));
  for (let i = 0; i < N; i++) {
    const d0 = dv[i], d1 = dv[i + 1];
    if (!isFinite(d0) || !isFinite(d1) || Math.abs(d0) < 1e-9 || Math.abs(d1) < 1e-9) continue;
    if (Math.sign(d0) !== Math.sign(d1)) {
      const xc = bis(D, xs[i], xs[i + 1]);
      if (isFinite(F(xc)) && Math.abs(F(xc)) < 1e6 && Math.abs(D(xc)) < 1e-3) ext.push({ x: xc, y: F(xc), t: d0 > 0 ? 'max' : 'min' });
    }
    const s0 = sv[i], s1 = sv[i + 1];
    if (!isFinite(s0) || !isFinite(s1) || Math.abs(s0) < 1e-6 || Math.abs(s1) < 1e-6) continue;
    if (Math.sign(s0) !== Math.sign(s1)) {
      const xc = bis(S2, xs[i], xs[i + 1]);
      if (isFinite(F(xc)) && Math.abs(F(xc)) < 1e6) infl.push({ x: xc, y: F(xc) });
    }
  }
  // Intervali monotonosti i konveksnosti
  const runs = (arr, pos, neg) => {
    const out = []; let cur2 = null, start = null;
    for (let i = 0; i <= N; i++) {
      const s = arr[i];
      if (!isFinite(s) || Math.abs(s) < 1e-9) continue;
      const sg = s > 0 ? 1 : -1;
      if (cur2 === null) { cur2 = sg; start = xs[i]; }
      else if (sg !== cur2) { out.push({ s: start, e: xs[i], t: cur2 }); cur2 = sg; start = xs[i]; }
    }
    if (cur2 !== null) out.push({ s: start, e: xs[N], t: cur2 });
    return out.filter(r => r.e - r.s > (b - a) / 200);
  };
  const mono = runs(dv).map(r => `${r.t > 0 ? RR('rises') : RR('falls')} [${fmt(r.s)}; ${fmt(r.e)}]`);
  const conv = runs(sv).map(r => `${r.t > 0 ? RR('up') : RR('down')} [${fmt(r.s)}; ${fmt(r.e)}]`);
  const uniq = arr => arr.filter((x, i) => i === 0 || Math.abs(x - arr[i - 1]) > (b - a) / 500);
  const zu = uniq(zeros.sort((p, q) => p - q));
  const maxs = ext.filter(e => e.t === 'max'), mins = ext.filter(e => e.t === 'min');
  const ni = infl.length, ne = ext.length;
  let shape;
  if (ne === 0 && ni === 0) shape = RR('monotone');
  else shape = `${RR('wiggly')}: ${ne} ${RR('maxs').toLowerCase()} / ${RR('mins').toLowerCase()}, ${ni} ${RR('infl').toLowerCase()}`;
  const pt = (p) => `(${fmt(p.x)}; ${fmt(p.y)})`;
  const text = L(
    `${RR('zeros')}: ${zu.length ? zu.map(x => fmt(x)).join(', ') : RR('nope')}`,
    `${RR('maxs')}: ${maxs.length ? maxs.map(pt).join(', ') : RR('nope')}`,
    `${RR('mins')}: ${mins.length ? mins.map(pt).join(', ') : RR('nope')}`,
    `${RR('infl')}: ${infl.length ? infl.map(pt).join(', ') : RR('nope')}`,
    `${RR('mono')}: ${mono.length ? mono.join('; ') : RR('nope')}`,
    `${RR('convex')}: ${conv.length ? conv.join('; ') : RR('nope')}`,
    `${RR('disco')}: ${disc.length ? uniq(disc).slice(0, 6).map(x => fmt(x)).join(', ') : RR('nope')}`,
    `${RR('wiggle')}: ${shape}`
  );
  const marks = [...zu.map(x => ({ x, y: 0, c: '#111111' })), ...maxs.map(p => ({ x: p.x, y: p.y, c: '#ff3b30', l: 'max' })),
    ...mins.map(p => ({ x: p.x, y: p.y, c: '#34c759', l: 'min' })), ...infl.map(p => ({ x: p.x, y: p.y, c: '#af52de', l: 'inf' }))];
  const curve = xs.map((x, i) => [x, ys[i]]);
  return { text, svg: svgPlot([{ pts: curve }], marks) };
}

function parAnalysis(v) {
  needMath();
  const fx = ex(v.xt), fy = ex(v.yt), t0 = v.t0, t1 = v.t1;
  if (!(t1 > t0)) return 't₁ mora biti veće od t₀.';
  const N = 1000, h = (t1 - t0) / N, pts = [];
  for (let i = 0; i <= N; i++) { const t = t0 + i * h; pts.push([math.evaluate(fx, { t }), math.evaluate(fy, { t })]); }
  let cX = 0, cY = 0;
  for (let i = 0; i < N - 1; i++) {
    const vx0 = pts[i + 1][0] - pts[i][0], vx1 = pts[i + 2][0] - pts[i + 1][0];
    const vy0 = pts[i + 1][1] - pts[i][1], vy1 = pts[i + 2][1] - pts[i + 1][1];
    if (vx0 * vx1 < 0) cX++;
    if (vy0 * vy1 < 0) cY++;
  }
  const dist0 = Math.hypot(pts[0][0] - pts[N][0], pts[0][1] - pts[N][1]);
  const closedC = dist0 < 1e-6 * (1 + Math.abs(pts[0][0]) + Math.abs(pts[0][1]));
  const xsA = pts.map(p => p[0]).filter(isFinite), ysA = pts.map(p => p[1]).filter(isFinite);
  const turns = cX + cY;
  const text = L(
    `${RR('closed')}: ${closedC ? RR('yes') : RR('no')}`,
    `x(t) [${fmt(Math.min(...xsA))}; ${fmt(Math.max(...xsA))}], y(t) [${fmt(Math.min(...ysA))}; ${fmt(Math.max(...ysA))}]`,
    `${RR('wiggle')}: ${turns === 0 ? RR('monotone') : `${RR('wiggly')}: ${turns} ${turns === 1 ? 'okret' : 'okreta'} (x: ${cX}, y: ${cY})`}`
  );
  return { text, svg: svgPlot([{ pts, c: '#007aff' }], [{ x: pts[0][0], y: pts[0][1], l: 't₀', c: '#34c759' }, { x: pts[N][0], y: pts[N][1], l: 't₁', c: '#ff3b30' }], { equal: true }) };
}

function lineAnalysis(v) {
  const x1 = v.x1, y1 = v.y1, x2 = v.x2, y2 = v.y2;
  if (x1 === x2 && y1 === y2) return 'Dve tačke moraju biti različite.';
  const A = y2 - y1, B = x1 - x2, C = -(A * x1 + B * y1);
  const parts = [];
  parts.push(`Opšti oblik: ${fmt(A)}x ${B < 0 ? '−' : '+'} ${fmt(Math.abs(B))}y ${C < 0 ? '−' : '+'} ${fmt(Math.abs(C))} = 0`);
  if (x1 === x2) parts.push(`x = ${fmt(x1)} (vertikalna prava, nagib ne postoji)`);
  else {
    const k = (y2 - y1) / (x2 - x1), n = y1 - k * x1;
    parts.push(`${RR('slope')} k = ${fmt(k)}`, `Eksplicitni oblik: y = ${fmt(k)}x ${n < 0 ? '−' : '+'} ${fmt(Math.abs(n))}`);
    parts.push(`${RR('angle')} sa x-osom = ${fmt(Math.atan(k) * 180 / Math.PI)}°`);
    parts.push(`Presek sa y-osom: (0; ${fmt(n)})`);
    if (k !== 0) parts.push(`Presek sa x-osom: (${fmt(-n / k)}; 0)`);
  }
  if (v.px !== '' && v.py !== '' && v.px !== undefined) {
    const px = num(v.px), py = num(v.py);
    if (isFinite(px) && isFinite(py)) parts.push(`Tačka (${fmt(px)}; ${fmt(py)}): ${Math.abs(A * px + B * py + C) < 1e-9 ? RR('onLine') : RR('offLine')}`);
  }
  const L2 = 2 + 2 * Math.max(Math.abs(x1), Math.abs(x2), Math.abs(y1), Math.abs(y2));
  let linePtsArr;
  if (x1 === x2) linePtsArr = Array.from({ length: 201 }, (_, i) => [x1, -L2 + 2 * L2 * i / 200]);
  else linePtsArr = linePts(A, B, C, L2);
  const marks = [{ x: x1, y: y1, l: 'P₁', c: '#ff3b30' }, { x: x2, y: y2, l: 'P₂', c: '#ff3b30' }];
  if (v.px !== '' && v.py !== undefined && v.px !== '') marks.push({ x: num(v.px), y: num(v.py), l: 'P', c: '#34c759' });
  return { text: parts.join('\n'), svg: svgPlot([{ pts: linePtsArr, c: '#007aff' }], marks) };
}

function interAnalysis(v) {
  const { a1, b1, c1, a2, b2, c2 } = v;
  const det = a1 * b2 - a2 * b1;
  const L2 = 3 + 2 * Math.max(Math.abs(c1), Math.abs(c2), Math.abs(a1), Math.abs(b1), Math.abs(a2), Math.abs(b2));
  const l1 = Math.abs(b1) >= Math.abs(a1) ? linePts(a1, b1, c1, L2) : linePts(a1, b1, c1, L2);
  const l2 = linePts(a2, b2, c2, L2);
  if (det === 0) {
    const coinc = Math.abs(a1 * c2 - a2 * c1) < 1e-9 && Math.abs(b1 * c2 - b2 * c1) < 1e-9;
    return { text: coinc ? RR('coinc') : RR('paral'), svg: svgPlot([{ pts: l1, c: '#007aff' }, { pts: l2, c: '#ff9500' }], []) };
  }
  const x = (c1 * b2 - c2 * b1) / det, y = (a1 * c2 - a2 * c1) / det;
  return { text: `${RR('inter')}: (${fmt(x)}; ${fmt(y)})`, svg: svgPlot([{ pts: l1, c: '#007aff' }, { pts: l2, c: '#ff9500' }], [{ x, y, l: 'S', c: '#ff3b30' }]) };
}

function distAnalysis(v) {
  const { px, py, A, B, C } = v;
  const den = A * A + B * B;
  if (den === 0) return 'A i B ne smeju oba biti 0.';
  const s = A * px + B * py + C;
  const d = Math.abs(s) / Math.sqrt(den);
  const fx = px - A * s / den, fy = py - B * s / den;
  const L2 = 3 + 2 * Math.max(Math.abs(px), Math.abs(py), Math.abs(C / (A || B || 1)));
  const lp = linePts(A, B, C, L2);
  return {
    text: L(`${RR('dist')} = ${fmt(d)}`, `${RR('foot')}: (${fmt(fx)}; ${fmt(fy)})`),
    svg: svgPlot([{ pts: lp, c: '#007aff' }, { pts: [[px, py], [fx, fy]], c: '#ff9500', dash: true }], [{ x: px, y: py, l: 'P', c: '#ff3b30' }, { x: fx, y: fy, l: 'N', c: '#34c759' }])
  };
}

function conicAnalysis(v) {
  const { A, B, C, D, E, F } = v;
  const disc = B * B - 4 * A * C;
  let type;
  if (A === 0 && B === 0 && C === 0) return 'Linearna jednačina, nije konika.';
  if (disc < 0) type = (A === C && B === 0) ? 'kružnica' : 'elipsa';
  else if (disc === 0) type = 'parabola';
  else type = 'hiperbola';
  const parts = [`${RR('conicType')}: ${type} (Δ = B² − 4AC = ${fmt(disc)})`];
  if (B !== 0) return { text: L(...parts, RR('rotated')), svg: '' };
  let svg = '';
  if (A !== 0 && C !== 0) {
    const h = -D / (2 * A), k = -E / (2 * C);
    const K = D * D / (4 * A) + E * E / (4 * C) - F;
    parts.push(`${RR('center')} = (${fmt(h)}; ${fmt(k)})`);
    if (disc < 0) {
      if (K / A > 0 && K / C > 0) {
        const a = Math.sqrt(K / A), b = Math.sqrt(K / C);
        parts.push(`Poluose: a = ${fmt(a)}, b = ${fmt(b)}`);
        const R0 = Math.max(a, b) * 1.4;
        svg = svgPlot([{ pts: Array.from({ length: 181 }, (_, i) => { const t = 2 * Math.PI * i / 180; return [h + a * Math.cos(t), k + b * Math.sin(t)]; }) }], [{ x: h, y: k, l: 'C' }], { equal: true });
        parts.push(`Krajnje tačke: (${fmt(h + a)}; ${fmt(k)}), (${fmt(h - a)}; ${fmt(k)}), (${fmt(h)}; ${fmt(k + b)}), (${fmt(h)}; ${fmt(k - b)})`);
      } else if (K === 0) parts.push('Jednačina predstavlja jednu tačku.');
      else parts.push('Jednačina nema realnih tačaka (prazan skup).');
    } else if (disc > 0) {
      if (K !== 0) {
        if (K / A > 0) {
          const a = Math.sqrt(K / A), b = Math.sqrt(-K / C);
          parts.push(`Hiperbola sa x-osom: a = ${fmt(a)}, b = ${fmt(b)}`);
          const ts = Array.from({ length: 121 }, (_, i) => -3 + 6 * i / 120);
          const br = [];
          ts.forEach(t => br.push([h + a * Math.cosh(t), k + b * Math.sinh(t)]));
          const br2 = ts.map(t => [h - a * Math.cosh(t), k + b * Math.sinh(t)]);
          svg = svgPlot([{ pts: br }, { pts: br2 }], [{ x: h, y: k, l: 'C' }], { equal: true });
        } else {
          const b = Math.sqrt(K / C), a = Math.sqrt(-K / A);
          parts.push(`Hiperbola sa y-osom: a = ${fmt(a)}, b = ${fmt(b)}`);
          const ts = Array.from({ length: 121 }, (_, i) => -3 + 6 * i / 120);
          const br = ts.map(t => [h + a * Math.sinh(t), k + b * Math.cosh(t)]);
          const br2 = ts.map(t => [h + a * Math.sinh(t), k - b * Math.cosh(t)]);
          svg = svgPlot([{ pts: br }, { pts: br2 }], [{ x: h, y: k, l: 'C' }], { equal: true });
        }
      } else parts.push('Dve prave koje se seku (degenerisana hiperbola).');
    }
  } else {
    // Parabola sa osom paralelnom koordinatnoj osi
    if (A === 0 && C !== 0 && D !== 0) {
      const ys = Array.from({ length: 201 }, (_, i) => -10 + 20 * i / 200);
      const pts = ys.map(y => [-(C * y * y + E * y + F) / D, y]);
      parts.push('Parabola sa osom paralelnom x-osi');
      svg = svgPlot([{ pts }], [], { equal: true });
    } else if (C === 0 && A !== 0 && E !== 0) {
      const xs = Array.from({ length: 201 }, (_, i) => -10 + 20 * i / 200);
      const pts = xs.map(x => [x, -(A * x * x + D * x + F) / E]);
      parts.push('Parabola sa osom paralelnom y-osi');
      svg = svgPlot([{ pts }], [], { equal: true });
    } else parts.push('Degenerisani slučaj (nema standardnog crteža).');
  }
  return { text: L(...parts), svg };
}

function areaAnalysis(v) {
  const [x1, y1, x2, y2, x3, y3] = [v.x1, v.y1, v.x2, v.y2, v.x3, v.y3];
  const A2 = x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2);
  const area = Math.abs(A2) / 2;
  const sides = [Math.hypot(x2 - x1, y2 - y1), Math.hypot(x3 - x2, y3 - y2), Math.hypot(x1 - x3, y1 - y3)];
  const G = [(x1 + x2 + x3) / 3, (y1 + y2 + y3) / 3];
  const text = L(
    area < 1e-12 ? RR('collinear') : kv('area', area),
    `${RR('perim')}: ${fmt(sides[0] + sides[1] + sides[2])}`,
    `${RR('dist')} AB = ${fmt(sides[0])}, BC = ${fmt(sides[1])}, CA = ${fmt(sides[2])}`,
    `Težište T = (${fmt(G[0])}; ${fmt(G[1])})`
  );
  return { text, svg: svgPlot([{ pts: [[x1, y1], [x2, y2], [x3, y3], [x1, y1]], fill: '#007aff', closed: true }],
    [{ x: x1, y: y1, l: 'A' }, { x: x2, y: y2, l: 'B' }, { x: x3, y: y3, l: 'C' }, { x: G[0], y: G[1], l: 'T', c: '#ff2d55' }], { equal: true }) };
}

   ===================================================================== */
function stat() {
  const arr = $('stIn').value.split(/[\s;]+/).filter(Boolean).map(num);
  if (arr.length === 0 || arr.some(x => !isFinite(x))) { $('stOut').textContent = T('msg_stat'); return; }
  const n = arr.length, sum = arr.reduce((a, b) => a + b, 0), mean = sum / n;
  const s = [...arr].sort((a, b) => a - b);
  const med = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
  const cnt = new Map(); arr.forEach(x => cnt.set(x, (cnt.get(x) || 0) + 1));
  const mx = Math.max(...cnt.values());
  const modes = [...cnt.keys()].filter(k => cnt.get(k) === mx);
  const mode = mx === 1 ? RR('nope') : modes.map(fmt).join(', ');
  const varP = arr.reduce((a, x) => a + (x - mean) ** 2, 0) / n;
  const lines = [
    `${RR('cnt')}: ${n}`, `${RR('sum')}: ${fmt(sum)}`, `${RR('mean')}: ${fmt(mean)}`, `${RR('median')}: ${fmt(med)}`,
    `${RR('mode')}: ${mode}`, `${RR('minmax')}: ${fmt(s[0])} / ${fmt(s[n - 1])}`, `${RR('range')}: ${fmt(s[n - 1] - s[0])}`,
    `${RR('varP')}: ${fmt(varP)}`, `${RR('sdP')}: ${fmt(Math.sqrt(varP))}`
  ];
  if (n > 1) { const varU = varP * n / (n - 1); lines.push(`${RR('varS')}: ${fmt(varU)}`, `${RR('sdS')}: ${fmt(Math.sqrt(varU))}`); }
  $('stOut').textContent = lines.join('\n');
}

async function getOcrWorker(onStatus) {
  if (ocrWorker) return ocrWorker;
  if (!ocrPromise.p) {
    ocrPromise.p = (async () => {
      if (typeof Tesseract === 'undefined') await loadScript('ocr/tesseract.min.js');
      return Tesseract.createWorker('eng', 1, {

        corePath: 'ocr/',

        logger: m => { if (onStatus && m.status) onStatus(m.status + (m.progress ? ' ' + Math.round(m.progress * 100) + '%' : '')); }

  ocrWorker = await ocrPromise.p;

}

// Pretvaranje teksta u oblik koji program razume
function normMath(s) {
  return String(s)
    .replace(/[−–—]/g, '-').replace(/[×·⋅]/g, '*').replace(/÷/g, '/')
    .replace(/²/g, '2').replace(/³/g, '3').replace(/\^/g, '')
    .replace(/\s+/g, '').replace(/\*/g, '')
    .replace(/(\d),(\d)/g, '$1.$2').toLowerCase();
}

// Polinom iz izraza: {x2: 2, x: 3, c: -5} ...
function parsePoly(str) {
  const s0 = normMath(str);
  if (!s0 || !/^[0-9a-z.+\-]+$/.test(s0)) return null;
  const s = (s0[0] === '+' || s0[0] === '-') ? s0 : '+' + s0;
  const terms = s.match(/[+-][^+-]+/g);
  if (!terms) return null;
  const res = {};
  for (const t of terms) {
    const m = t.match(/^([+-])(\d+(?:\.\d+)?)?([a-z])?(\d+)?$/);
    if (!m || (m[2] === undefined && m[3] === undefined)) return null;
    const sign = m[1] === '-' ? -1 : 1;
    const coef = m[2] !== undefined ? parseFloat(m[2]) : 1;
    const key = m[3] ? (m[4] ? m[3] + m[4] : m[3]) : 'c';
    res[key] = (res[key] || 0) + sign * coef;
  }
  return res;
}

function parseEq(line) {
  const parts = normMath(line).split('=');
  if (parts.length !== 2) return null;
  const Lp = parsePoly(parts[0]), Rp = parsePoly(parts[1]);
  if (!Lp || !Rp) return null;
  const poly = {};
  Object.keys(Lp).forEach(k => poly[k] = (poly[k] || 0) + Lp[k]);
  Object.keys(Rp).forEach(k => poly[k] = (poly[k] || 0) - Rp[k]);
  Object.keys(poly).forEach(k => { if (Math.abs(poly[k]) < 1e-12) delete poly[k]; });
  return poly;
}

// Ispis jednačine iz koeficijenata: "2x² − 3x + 5"
function eqStr(e) {
  let out = '';
  const add = (c, t) => {
    if (!c) return;
    const mag = (Math.abs(c) === 1 && t) ? '' : fmt(Math.abs(c));
    out += out === '' ? (c < 0 ? '−' : '') + mag + t : ' ' + (c < 0 ? '−' : '+') + ' ' + mag + t;
  };
  add(e.x2, 'x²'); add(e.x, 'x'); add(e.y, 'y'); add(e.c, '');
  return out || '0';
}

function quadSteps(e, orig) {
  const a = e.x2, b = e.x || 0, c = e.c || 0;
  const D = b * b - 4 * a * c;
  const out = [`Zadato: ${orig}`, `Jednačina: ${eqStr(e)} = 0`, `Koeficijenti: a = ${fmt(a)}, b = ${fmt(b)}, c = ${fmt(c)}`,
    '', 'Korak 1. Diskriminanta: D = b² − 4ac', `    D = (${fmt(b)})² − 4·(${fmt(a)})·(${fmt(c)}) = ${fmt(b * b)} − (${fmt(4 * a * c)}) = ${fmt(D)}`, ''];
  if (D > 0) {
    const s = Math.sqrt(D), x1 = (-b + s) / (2 * a), x2 = (-b - s) / (2 * a);
    out.push('Korak 2. D > 0, dva različita realna rešenja.', '    x = (−b ± √D) / (2a)',
      `    x₁ = (${fmt(-b)} + √${fmt(D)}) / (2·${fmt(a)}) = ${fmt(x1)}`,
      `    x₂ = (${fmt(-b)} − √${fmt(D)}) / (2·${fmt(a)}) = ${fmt(x2)}`, '',
      'Provera (zamena u jednačinu):',
      `    x₁: a·x₁² + b·x₁ + c = ${fmt(Math.abs(a * x1 * x1 + b * x1 + c) < 1e-9 ? 0 : a * x1 * x1 + b * x1 + c)}`,
      `    x₂: a·x₂² + b·x₂ + c = ${fmt(Math.abs(a * x2 * x2 + b * x2 + c) < 1e-9 ? 0 : a * x2 * x2 + b * x2 + c)}`);
  } else if (D === 0) {
    const x = -b / (2 * a);
    out.push('Korak 2. D = 0, jedno rešenje (dvostruko).', `    x = −b / (2a) = ${fmt(x)}`);
  } else {
    const re = -b / (2 * a), im = Math.sqrt(-D) / (2 * a);
    out.push('Korak 2. D < 0, nema realnih rešenja. Kompleksna rešenja:',
      `    x₁ = ${fmt(re)} + ${fmt(im)}i`, `    x₂ = ${fmt(re)} − ${fmt(im)}i`);
  }
  return out.join('\n');
}

function linearSteps(e, orig) {
  const a = e.x, c = e.c || 0;
  if (a === 0) return c === 0 ? `Zadato: ${orig}\nJednačina je tačna za svako x (beskonačno mnogo rešenja).` : `Zadato: ${orig}\nJednačina nema rešenja.`;
  const x = -c / a;
  return [`Zadato: ${orig}`, `Jednačina: ${eqStr(e)} = 0`, '',
    `Korak 1. Konstantu prebacujemo na desnu stranu: ${fmt(a)}x = ${fmt(-c)}`,
    `Korak 2. Delimo sa ${fmt(a)}: x = ${fmt(-c)} / ${fmt(a)} = ${fmt(x)}`, '',
    `Provera: ${fmt(a)}·(${fmt(x)}) + (${fmt(c)}) = ${fmt(Math.abs(a * x + c) < 1e-9 ? 0 : a * x + c)}`].join('\n');
}

function systemSteps(e1, e2, o1, o2) {
  const a1 = e1.x || 0, b1 = e1.y || 0, c1 = -(e1.c || 0);
  const a2 = e2.x || 0, b2 = e2.y || 0, c2 = -(e2.c || 0);
  const D = a1 * b2 - a2 * b1;
  const head = [`Zadato:\n  ${o1}\n  ${o2}`, `Sistem u obliku:\n  ${eqStr({ x: a1, y: b1, c: -c1 })} = 0\n  ${eqStr({ x: a2, y: b2, c: -c2 })} = 0`, ''];
  if (D === 0) return head.concat(['Glavna determinanta D = 0, sistem nema jedinstveno rešenje.']).join('\n');
  const Dx = c1 * b2 - c2 * b1, Dy = a1 * c2 - a2 * c1;
  const x = Dx / D, y = Dy / D;
  return head.concat([
    'Korak 1. Glavna determinanta D = a₁b₂ − a₂b₁',
    `    D = (${fmt(a1)})(${fmt(b2)}) − (${fmt(a2)})(${fmt(b1)}) = ${fmt(D)}`, '',
    'Korak 2. Determinanta po x: Dx = c₁b₂ − c₂b₁',
    `    Dx = (${fmt(c1)})(${fmt(b2)}) − (${fmt(c2)})(${fmt(b1)}) = ${fmt(Dx)}`, '',
    'Korak 3. Determinanta po y: Dy = a₁c₂ − a₂c₁',
    `    Dy = (${fmt(a1)})(${fmt(c2)}) − (${fmt(a2)})(${fmt(c1)}) = ${fmt(Dy)}`, '',
    'Korak 4. Rešenje: x = Dx / D, y = Dy / D',
    `    x = ${fmt(Dx)} / ${fmt(D)} = ${fmt(x)}`,
    `    y = ${fmt(Dy)} / ${fmt(D)} = ${fmt(y)}`, '',
    'Provera u prvoj jednačini:',
    `    a₁x + b₁y = ${fmt(a1 * x + b1 * y)} (treba da bude ${fmt(c1)})`
  ]).join('\n');
}

function solveText(text) {
  const lines = text.split(/\n|;/).map(s => s.trim()).filter(s => s.includes('='));
  if (!lines.length) return 'Nisam našao jednačinu (mora da sadrži znak =). Ispravi tekst pa pokušaj ponovo.';
  const eqs = lines.map(parseEq);
  const bad = eqs.findIndex(e => !e);
  if (bad >= 0) return `Ne mogu da pročitam jednačinu:\n${lines[bad]}\n\nPodržano: ax² + bx + c = 0, ax + b = c i sistem sa x i y.`;
  const allowed = new Set(['c', 'x', 'x2', 'y']);
  if (eqs.some(e => Object.keys(e).some(k => !allowed.has(k)))) return 'Podržani su samo članovi x², x, y i konstante.';

  if (eqs.length === 1) {
    const e = eqs[0];
    if (e.x2 !== undefined && e.y === undefined) return quadSteps(e, lines[0]);
    if (e.x2 === undefined && e.y === undefined && e.x !== undefined) return linearSteps(e, lines[0]);
    return 'Za jednu jednačinu podržana su samo ax² + bx + c = 0 i ax + b = c.';
  }
  if (eqs.length === 2) {
    if (eqs.some(e => e.x2 !== undefined)) return 'Sistem sa kvadratnim članom nije podržan.';
    return systemSteps(eqs[0], eqs[1], lines[0], lines[1]);
  }
  return 'Podržano je najviše dve jednačine.';
}

$('camSolve').onclick = () => {
  const t = $('camText').value;
  $('camOut').textContent = solveText(t);
};

applyLang();
</script>

    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
